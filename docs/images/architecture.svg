<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="1280" height="940" role="img" aria-labelledby="title desc"><title id="title">Personal Agent Web 3.0 执行架构</title><desc id="desc">用户消息进入本机队列。Engine 先处理到期提醒，再为对话、目标工作、心跳和记忆整理选择运行模式。模型通过受限工具工作，产品服务校验并将反馈送回同一长对话。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#344753"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#327298"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#a65331"/></marker></defs><rect width="1280" height="940" fill="#fafbf9"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="53" font-size="34" font-weight="700" fill="#24323a">Personal Agent Web</text><text x="383" y="53" font-size="24" font-weight="460" fill="#58676d">/   v3.0.0</text><text x="36" y="93" font-size="27" font-weight="600" fill="#24323a">一条长对话背后的执行架构</text><text x="37" y="145" font-size="19" font-weight="650" fill="#327298">交互入口</text><text x="401" y="145" font-size="19" font-weight="650" fill="#24323a">本机产品服务</text><text x="855" y="145" font-size="19" font-weight="650" fill="#a65331">受限模型执行</text><rect x="35" y="168" width="266" height="480" rx="13" fill="#f0f5f7" stroke="#c7d1d4"/><rect x="385" y="168" width="368" height="480" rx="13" fill="#f0f3f1" stroke="#c7d1d4"/><rect x="836" y="168" width="408" height="480" rx="13" fill="#f9f2ed" stroke="#c7d1d4"/><rect x="50" y="195" width="236" height="124" rx="13" fill="#fff" stroke="#c7d1d4"/><text x="68" y="227" font-size="22" font-weight="640" fill="#24323a">React Web</text><text x="68" y="257" font-size="17" font-weight="400" fill="#24323a">用户输入、回复或改期</text><text x="68" y="282" font-size="17" font-weight="400" fill="#24323a">管理目标和通知设置</text><rect x="50" y="482" width="236" height="137" rx="13" fill="#fff" stroke="#c7d1d4"/><text x="68" y="514" font-size="22" font-weight="640" fill="#24323a">同一段长对话</text><text x="68" y="544" font-size="17" font-weight="400" fill="#24323a">回复与动作回执</text><text x="68" y="569" font-size="17" font-weight="400" fill="#24323a">目标进展、提醒与成果</text><rect x="402" y="195" width="334" height="108" rx="13" fill="#fff" stroke="#c7d1d4"/><text x="420" y="227" font-size="22" font-weight="640" fill="#24323a">本地 API 与消息队列</text><text x="420" y="257" font-size="17" font-weight="400" fill="#24323a">校验本机授权，保存输入</text><rect x="402" y="350" width="334" height="122" rx="13" fill="#fff" stroke="#c7d1d4"/><text x="420" y="382" font-size="22" font-weight="640" fill="#24323a">Engine 调度</text><text x="420" y="412" font-size="17" font-weight="400" fill="#24323a">每 5 秒检查到期工作</text><text x="420" y="437" font-size="17" font-weight="400" fill="#24323a">前台优先，共用一个模型执行槽</text><text x="420" y="462" font-size="15" fill="#455b62">重复任务 · 目标复查 · 30 分钟心跳</text><rect x="402" y="514" width="334" height="107" rx="13" fill="#fff" stroke="#c7d1d4"/><text x="420" y="546" font-size="22" font-weight="640" fill="#24323a">保存与交付</text><text x="420" y="576" font-size="17" font-weight="400" fill="#24323a">校验授权、版本和成果</text><text x="420" y="601" font-size="17" font-weight="400" fill="#24323a">按交付约定写入对话</text><path d="M289 251 H397" fill="none" stroke="#327298" stroke-width="2.3" marker-end="url(#blue)"/><path d="M565 305 V345" fill="none" stroke="#344753" stroke-width="2.3" marker-end="url(#ink)"/><path d="M565 474 V509" fill="none" stroke="#344753" stroke-width="2.3" marker-end="url(#ink)"/><text x="583" y="498" font-size="15" font-weight="500" fill="#58676d">到期提醒</text><path d="M399 557 H290" fill="none" stroke="#327298" stroke-width="2.3" marker-end="url(#blue)"/><rect x="853" y="195" width="375" height="156" rx="13" fill="#fff" stroke="#c7d1d4"/><text x="871" y="227" font-size="22" font-weight="640" fill="#24323a">DeepSeek Harness</text><text x="871" y="257" font-size="17" font-weight="400" fill="#24323a">对话 · 理解意图，答复或澄清</text><text x="871" y="282" font-size="17" font-weight="400" fill="#24323a">工作 · 执行 Task 或推进 Goal</text><text x="871" y="307" font-size="17" font-weight="400" fill="#24323a">心跳 · 判断是否关心   /   整理 · 审阅记忆</text><rect x="853" y="392" width="375" height="229" rx="13" fill="#fff" stroke="#c7d1d4"/><text x="871" y="424" font-size="22" font-weight="640" fill="#24323a">按运行模式提供工具</text><text x="871" y="454" font-size="17" font-weight="400" fill="#24323a">对话：记忆、目标、任务、进展</text><text x="871" y="479" font-size="17" font-weight="400" fill="#24323a">工作：读目标上下文，暂存成果</text><text x="871" y="504" font-size="17" font-weight="400" fill="#24323a">联网：允许时搜索、读取公开网页</text><text x="871" y="529" font-size="17" font-weight="400" fill="#24323a">整理：返回提案，由产品服务校验</text><text x="871" y="554" font-size="17" font-weight="400" fill="#24323a">模型调用使用服务端 DeepSeek 配置</text><path d="M736 399 H788 V272 H849" fill="none" stroke="#a65331" stroke-width="2.3" marker-end="url(#rust)"/><path d="M1042 353 V389" fill="none" stroke="#a65331" stroke-width="2.3" marker-end="url(#rust)"/><path d="M851 553 H740" fill="none" stroke="#a65331" stroke-width="2.3" marker-end="url(#rust)"/><rect x="36" y="704" width="1208" height="144" rx="13" fill="#fff" stroke="#c7d1d4"/><path d="M564 649 V701" fill="none" stroke="#344753" stroke-width="2.3" marker-end="url(#ink)"/><text x="56" y="737" font-size="23" font-weight="650" fill="#24323a">SQLite   /   本机持久状态</text><text x="56" y="780" font-size="19" font-weight="610" fill="#24323a">对话与个人上下文</text><text x="56" y="814" font-size="16" font-weight="400" fill="#24323a">消息、记忆来源、Agent Profile</text><text x="455" y="780" font-size="19" font-weight="610" fill="#24323a">工作与排期</text><text x="455" y="814" font-size="16" font-weight="400" fill="#24323a">Goal、所属 Task、到期记录、执行状态</text><text x="869" y="780" font-size="19" font-weight="610" fill="#24323a">成果与交付</text><text x="869" y="814" font-size="16" font-weight="400" fill="#24323a">成果版本、目标动态、消息交付记录</text><text x="36" y="898" font-size="19" font-weight="400" fill="#24323a">定时提醒由服务直接交付。目标复查、心跳和研究按需调用模型，结果由产品服务保存。</text></g></svg>